name: dependabot

# Policy: minor updates and critical security updates (CVSS >= 9.0) merge automatically
# once the `tests` workflow is green. Other updates stay open for manual review.
#
# pull_request_target is required: Dependabot-triggered `pull_request` runs get a
# read-only GITHUB_TOKEN. This job never checks out PR code - it only labels the PR;
# the merge itself runs from `workflow_run`, after `tests` succeeds.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [tests]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  classify:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3

      - name: Mark updates for auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          CVSS: ${{ steps.metadata.outputs.cvss }}
        run: |
          auto=false
          if [ "$UPDATE_TYPE" = "version-update:semver-minor" ]; then
            auto=true
          elif [ -n "$CVSS" ] && awk "BEGIN { exit !($CVSS >= 9.0) }"; then
            auto=true
          fi

          if [ "$auto" = true ]; then
            gh pr edit "$PR_URL" --add-label automerge
          else
            gh pr edit "$PR_URL" --remove-label automerge >/dev/null 2>&1 || true
          fi

  merge:
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Merge marked dependabot PR for the tested commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq '[.[] | select(.user.login == "dependabot[bot]" and .state == "open")][0].number')
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "No open Dependabot PR for $SHA; nothing to merge."
            exit 0
          fi
          if ! gh pr view "$pr" --repo "$REPO" --json labels --jq '.labels[].name' | grep -qx automerge; then
            echo "PR #$pr is not marked for auto-merge; skipping."
            exit 0
          fi
          jobs=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[].conclusion] | unique | join(",")')
          if [ "$jobs" != "success" ]; then
            echo "Jobs did not pass ($jobs); not merging."
            exit 0
          fi
          gh pr merge "$pr" --repo "$REPO" --squash --match-head-commit "$SHA"
          echo "Merged #$pr."
